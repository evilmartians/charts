# Extra capacity for AKS's own pods (CoreDNS, konnectivity-agent, metrics-server and so on) when
# the system agent pool is full. They require "kubernetes.azure.com/mode: system" nodes, so they
# can't run on other node pools. Replaces AKS's "system-surge" pool (default_node_pools = "None")
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: system
spec:
  disruption:
    budgets:
      - nodes: 10%
    consolidateAfter: 15m
    consolidationPolicy: WhenEmptyOrUnderutilized

  template:
    metadata:
      labels:
        kubernetes.azure.com/mode: system
        # Karpenter needs it to predict overhead of the Cilium DaemonSet
        kubernetes.azure.com/ebpf-dataplane: cilium

    spec:
      expireAfter: 480h
      terminationGracePeriod: 24h0m0s

      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: ubuntu

      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
        - key: karpenter.azure.com/sku-family
          operator: In
          values:
            - D
        - key: karpenter.azure.com/sku-version
          operator: Gt
          values:
            - "4"
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: kubernetes.io/os
          operator: In
          values:
            - linux

      startupTaints:
        # https://karpenter.sh/docs/concepts/nodepools/#cilium-startup-taint
        - effect: NoExecute
          key: node.cilium.io/agent-not-ready
          value: "true"

      taints:
        - effect: NoSchedule
          key: CriticalAddonsOnly
          value: "true"

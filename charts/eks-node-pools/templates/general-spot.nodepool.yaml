apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general-spot
spec:
  disruption:
    budgets:
      - nodes: 10%
    consolidateAfter: 15m
    consolidationPolicy: WhenEmpty

  template:
    spec:
      expireAfter: 480h
      terminationGracePeriod: 24h0m0s

      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: default

      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot
        - key: eks.amazonaws.com/instance-category
          operator: In
          values:
            - c
            - m
            - r
        - key: eks.amazonaws.com/instance-generation
          operator: Gt
          values:
            - "4"
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
        # do not include flex instances (c7i-flex, c8i-flex, m7i-flex, etc.)
        # they're sort of like burstable t-series and don't guarantee performance.
        # we've had problems with them.
        - key: eks.amazonaws.com/instance-capability-flex
          operator: In
          values:
            - "false"

      taints:
        - effect: NoSchedule
          key: ManualOnly
